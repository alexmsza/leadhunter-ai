<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#334155" stroke-width="1.5" />

  <!-- Círculo de Radar / Alcance Forense -->
  <circle cx="32" cy="32" r="20" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="32" cy="32" r="14" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="7" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Mira Reticular (Crosshairs) -->
  <line x1="32" y1="8" x2="32" y2="15" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="49" x2="32" y2="56" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="8" y1="32" x2="15" y2="32" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="49" y1="32" x2="56" y2="32" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Ponto Central de Foco / IA -->
  <circle cx="32" cy="32" r="4" fill="url(#pulseGlow)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />
  
  <!-- Acento Forense de Veracidade (Check no quadrante) -->
  <circle cx="45" cy="19" r="4.5" fill="#10B981" />
  <path d="M43 19L44.5 20.5L47.5 17.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
