<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none">
  <defs>
    <linearGradient id="logoIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Símbolo / Ícone -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#logoIconBg)" />
    <rect x="0.5" y="0.5" width="55" height="55" rx="13.5" stroke="#334155" stroke-width="1" />
    
    <circle cx="28" cy="28" r="17" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="28" cy="28" r="12" stroke="url(#logoCyan)" stroke-width="2" stroke-dasharray="3 2" />
    <circle cx="28" cy="28" r="6" stroke="#38BDF8" stroke-width="1.5" />

    <line x1="28" y1="7" x2="28" y2="13" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="43" x2="28" y2="49" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="7" y1="28" x2="13" y2="28" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <line x1="43" y1="28" x2="49" y2="28" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <circle cx="28" cy="28" r="2.5" fill="#FFFFFF" />
    
    <circle cx="40" cy="16" r="4" fill="#10B981" />
    <path d="M38 16L39.5 17.5L42.5 14.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tipografia "LeadHunter" -->
  <text x="72" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
    LeadHunter
  </text>

  <!-- Badge ".ai" -->
  <g transform="translate(224, 18)">
    <rect width="36" height="24" rx="6" fill="#0F172A" />
    <text x="18" y="16.5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle">
      .ai
    </text>
  </g>

  <!-- Tagline / Subtítulo -->
  <text x="73" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.5">
    AUDITORIA FORENSE &amp; PROSPECÇÃO B2B
  </text>
</svg>
